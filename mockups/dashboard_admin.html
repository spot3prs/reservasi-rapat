<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Mockup</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .sidebar {
            width: 250px;
            background-color: #333;
            color: white;
            height: 100vh;
            position: fixed;
            padding: 20px;
        }
        .main-content {
            margin-left: 270px;
            padding: 20px;
        }
        .menu-item {
            padding: 10px;
            margin: 5px 0;
            cursor: pointer;
        }
        .menu-item:hover {
            background-color: #444;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .recent-activity {
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Admin Panel</h2>
        <div class="menu-item">Dashboard</div>
        <div class="menu-item">Kelola Reservasi</div>
        <div class="menu-item">Kelola Pegawai</div>
        <div class="menu-item">Laporan</div>
        <div class="menu-item">Pengaturan</div>
        <div class="menu-item">Logout</div>
    </div>

    <div class="main-content">
        <h1>Dashboard</h1>
        
        <div class="stats">
            <div class="stat-card">
                <h3>Total Reservasi</h3>
                <p>25</p>
            </div>
            <div class="stat-card">
                <h3>Pegawai Aktif</h3>
                <p>15</p>
            </div>
            <div class="stat-card">
                <h3>Ruangan Tersedia</h3>
                <p>5</p>
            </div>
        </div>

        <div class="recent-activity">
            <h2>Aktivitas Terbaru</h2>
            <ul>
                <li>Reservasi baru dari John Doe</li>
                <li>Pembatalan reservasi oleh Jane Smith</li>
                <li>Penambahan pegawai baru</li>
            </ul>
        </div>
    </div>
</body>
</html>
