<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Mockup</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .profile-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-color: #ddd;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: #666;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .section {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #ddd;
        }
        .section:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-header">
            <div class="profile-image">JD</div>
            <h1>John Doe</h1>
            <p>Staff Marketing</p>
        </div>

        <div class="section">
            <h2>Informasi Pribadi</h2>
            <div class="form-group">
                <label for="nip">NIP</label>
                <input type="text" id="nip" value="198501012010011001" readonly>
            </div>
            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" value="John Doe">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" value="john.doe@example.com">
            </div>
            <div class="form-group">
                <label for="jabatan">Jabatan</label>
                <input type="text" id="jabatan" value="Staff Marketing" readonly>
            </div>
        </div>

        <div class="section">
            <h2>Ubah Password</h2>
            <div class="form-group">
                <label for="current-password">Password Saat Ini</label>
                <input type="password" id="current-password">
            </div>
            <div class="form-group">
                <label for="new-password">Password Baru</label>
                <input type="password" id="new-password">
            </div>
            <div class="form-group">
                <label for="confirm-password">Konfirmasi Password Baru</label>
                <input type="password" id="confirm-password">
            </div>
            <button class="btn">Ubah Password</button>
        </div>

        <div class="section">
            <h2>Riwayat Reservasi</h2>
            <div class="form-group">
                <label for="reservation-history">5 Reservasi Terakhir</label>
                <div style="background: #f8f9fa; padding: 10px; border-radius: 4px;">
                    <p>1. Rapat Tim Marketing - 20 Mar 2024</p>
                    <p>2. Presentasi Proyek - 15 Mar 2024</p>
                    <p>3. Meeting Client - 10 Mar 2024</p>
                    <p>4. Rapat Koordinasi - 5 Mar 2024</p>
                    <p>5. Training Internal - 1 Mar 2024</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
