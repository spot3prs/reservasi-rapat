<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Pegawai - Mockup</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .header {
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .col {
            flex: 1;
        }
        .btn {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn-secondary {
            background-color: #6c757d;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .required {
            color: #dc3545;
        }
        .help-text {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Tambah Pegawai Baru</h1>
            <p>Silakan lengkapi data pegawai baru di bawah ini</p>
        </div>

        <form>
            <div class="row">
                <div class="col">
                    <div class="form-group">
                        <label for="nip">NIP <span class="required">*</span></label>
                        <input type="text" id="nip" required>
                        <div class="help-text">Masukkan NIP 18 digit</div>
                    </div>
                </div>
                <div class="col">
                    <div class="form-group">
                        <label for="nama">Nama Lengkap <span class="required">*</span></label>
                        <input type="text" id="nama" required>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <div class="form-group">
                        <label for="email">Email <span class="required">*</span></label>
                        <input type="email" id="email" required>
                        <div class="help-text">Gunakan email perusahaan</div>
                    </div>
                </div>
                <div class="col">
                    <div class="form-group">
                        <label for="jabatan">Jabatan <span class="required">*</span></label>
                        <select id="jabatan" required>
                            <option value="">Pilih jabatan...</option>
                            <option value="staff">Staff</option>
                            <option value="supervisor">Supervisor</option>
                            <option value="manager">Manager</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <div class="form-group">
                        <label for="password">Password <span class="required">*</span></label>
                        <input type="password" id="password" required>
                        <div class="help-text">Minimal 8 karakter</div>
                    </div>
                </div>
                <div class="col">
                    <div class="form-group">
                        <label for="confirm-password">Konfirmasi Password <span class="required">*</span></label>
                        <input type="password" id="confirm-password" required>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="foto">Foto Pegawai</label>
                <input type="file" id="foto" accept="image/*">
                <div class="help-text">Format: JPG/PNG, maksimal 2MB</div>
            </div>

            <div class="actions">
                <button type="submit" class="btn">Simpan</button>
                <a href="#" class="btn btn-secondary">Batal</a>
            </div>
        </form>
    </div>
</body>
</html>
